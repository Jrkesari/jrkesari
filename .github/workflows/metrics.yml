name: Metrics

on:
  schedule: [{ cron: "30 18 * * *" }]  # 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: output
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6

      # metrics' habits plugin breaks on GitHub's trimmed PushEvent payloads, so this one is ours
      - uses: actions/checkout@v4
      - name: Habits
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/habits.py
      - name: Publish habits
        run: |
          git fetch origin output
          git worktree add out origin/output
          cp metrics/habits.svg out/metrics/habits.svg
          cd out
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add metrics/habits.svg
          git diff --cached --quiet || { git commit -m "Update habits.svg"; git push origin HEAD:output; }
